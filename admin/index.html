<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booking Requests — Blen Abebe</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#090b15;color:#f4f1f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#2b2447 0,transparent 35rem),#090b15}main{width:min(1120px,calc(100% - 2rem));margin:auto;padding:4rem 0}header{display:flex;justify-content:space-between;gap:2rem;align-items:end;margin-bottom:2rem}h1{font-size:clamp(2.5rem,6vw,5rem);letter-spacing:-.06em;margin:.5rem 0 0}.kicker{color:#a8e6cf;font-size:.7rem;font-weight:800;letter-spacing:.16em}.login{display:flex;gap:.5rem}input,button{height:2.8rem;border:1px solid #34374b;border-radius:.7rem;font:inherit}input{padding:0 .8rem;background:#101321;color:#fff}button{padding:0 1rem;background:#ff7657;color:#171018;font-weight:800;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-bottom:1rem}.summary div,.card{border:1px solid #2b2e40;background:rgba(18,21,36,.9);border-radius:1rem}.summary div{padding:1rem}.summary strong{display:block;font-size:1.6rem}.summary span{color:#8c8998;font-size:.7rem}.list{display:grid;gap:.75rem}.card{padding:1rem}.top{display:flex;justify-content:space-between;gap:1rem}.top strong{font-size:1rem}.top span,.meta{color:#8c8998;font-size:.7rem}.meta{display:flex;flex-wrap:wrap;gap:.45rem 1rem;margin-top:.7rem}.message{margin:.9rem 0 0;padding-top:.8rem;border-top:1px solid #292c3d;color:#c5c2cd;font-size:.8rem;line-height:1.6}.empty{padding:4rem 1rem;text-align:center;color:#777482;border:1px dashed #34374b;border-radius:1rem}@media(max-width:720px){header{align-items:stretch;flex-direction:column}.login{flex-direction:column}.summary{grid-template-columns:1fr}}
  </style>
</head>
<body><main><header><div><span class="kicker">PRIVATE WORKSPACE</span><h1>Meeting requests</h1></div><form class="login" id="login"><input id="token" type="password" autocomplete="current-password" placeholder="Admin access token" required><button>View requests</button></form></header><section class="summary" id="summary"></section><section class="list" id="list"><div class="empty">Enter the private admin token to view booking requests.</div></section></main>
<script>
const login=document.querySelector('#login'),token=document.querySelector('#token'),list=document.querySelector('#list'),summary=document.querySelector('#summary');
token.value=sessionStorage.getItem('bookingAdminToken')||'';
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
async function load(){const value=token.value.trim();if(!value)return;sessionStorage.setItem('bookingAdminToken',value);list.innerHTML='<div class="empty">Loading requests…</div>';const response=await fetch('/api/bookings',{headers:{Authorization:`Bearer ${value}`}});if(!response.ok){list.innerHTML='<div class="empty">Access was not accepted. Check the admin token.</div>';summary.innerHTML='';return}const rows=await response.json();const now=Math.floor(Date.now()/1000),week=rows.filter(row=>row.created_at>now-604800).length;summary.innerHTML=`<div><strong>${rows.length}</strong><span>recent requests</span></div><div><strong>${week}</strong><span>received this week</span></div><div><strong>${rows.filter(row=>row.email_status==='sent').length}</strong><span>confirmations sent</span></div>`;list.innerHTML=rows.length?rows.map(row=>`<article class="card"><div class="top"><strong>${esc(row.name)}</strong><span>${new Date(row.created_at*1000).toLocaleString()}</span></div><div class="meta"><span>${esc(row.email)}</span><span>${esc(row.company||'No company')}</span><span>${esc(row.conversation)}</span><span>${esc(row.requested_date)} · ${esc(row.requested_time)}</span><span>${esc(row.email_status)}</span></div><p class="message">${esc(row.message||'No message provided')}</p></article>`).join(''):'<div class="empty">No meeting requests yet.</div>'}
login.addEventListener('submit',event=>{event.preventDefault();load()});if(token.value)load();
</script></body></html>
